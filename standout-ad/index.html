<style>

</style>

<div id="viewport"><div id="stage"></div></div>
<div id="big"><div><svg width="44" height="50" viewBox="0 0 44 50"><path d="M4 3 L41 25 L4 47 Z" fill="#fff"/></svg></div></div>
<div id="ui"><button id="pp">Play</button><input id="seek" type="range" min="0" max="15000" value="0"><span id="tc">0.00 / 15.00</span></div>
<audio id="snd" src="soundtrack.m4a" preload="auto"></audio>
<script src="assets/geometry.js"></script>
<script>
(() => {
"use strict";
const RENDER = new URLSearchParams(location.search).has("render");
if (RENDER) document.documentElement.classList.add("render");

/* ================= timing ================= */
const BPM = 128, BEAT = 60 / BPM, BAR = 4 * BEAT, DUR = 15;
const B = (bar, beat = 0) => (bar - 1) * BAR + beat * BEAT;     // bar is 1-based, beat 0-based
const T = {b2: B(2), b3: B(3), b4: B(4), b5: B(5), b6: B(6), b7: B(7), b8: B(8)};

/* ================= math ================= */
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, p) => a + (b - a) * p;
const P = (t, t0, d) => clamp((t - t0) / d);
const E = {
  lin: p => p,
  out2: p => 1 - (1 - p) ** 2, in2: p => p * p,
  out3: p => 1 - (1 - p) ** 3, in3: p => p ** 3, io3: p => p < .5 ? 4 * p ** 3 : 1 - (-2 * p + 2) ** 3 / 2,
  out4: p => 1 - (1 - p) ** 4, in4: p => p ** 4,
  out5: p => 1 - (1 - p) ** 5, io5: p => p < .5 ? 16 * p ** 5 : 1 - (-2 * p + 2) ** 5 / 2,
  outX: p => p >= 1 ? 1 : 1 - 2 ** (-10 * p), inX: p => p <= 0 ? 0 : 2 ** (10 * p - 10),
  ioX: p => p <= 0 ? 0 : p >= 1 ? 1 : p < .5 ? 2 ** (20 * p - 10) / 2 : (2 - 2 ** (-20 * p + 10)) / 2,
  ioS: p => -(Math.cos(Math.PI * p) - 1) / 2,
  outB: (p, s = 1.7) => 1 + (s + 1) * (p - 1) ** 3 + s * (p - 1) ** 2,
};
const tw = (t, t0, d, e = E.out3) => e(P(t, t0, d));
// analytic damped spring (step response); f = natural frequency (Hz), z = damping ratio
function spring(dt, f = 2, z = .5) {
  if (dt <= 0) return 0;
  const w = 2 * Math.PI * f;
  if (z < 1) { const wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * dt) * (Math.cos(wd * dt) + z * w / wd * Math.sin(wd * dt)); }
  return 1 - Math.exp(-w * dt) * (1 + w * dt);
}
const wob = (dt, f = 8, k = 10) => dt < 0 ? 0 : Math.sin(2 * Math.PI * f * dt) * Math.exp(-k * dt);
const bump = (dt, k = 10) => dt < 0 ? 0 : dt * k * Math.exp(1 - dt * k);       // 0 -> 1 (at 1/k) -> 0
const rnd = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const bez = (a, b, c, u) => (1 - u) * (1 - u) * a + 2 * (1 - u) * u * b + u * u * c;

/* ================= DOM helpers ================= */
const stage = document.getElementById("stage");
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function el(tag, cls, parent = stage, html = "", css = "") {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html) e.innerHTML = html;
  if (css) e.style.cssText = css;
  parent.appendChild(e);
  return e;
}
const f2 = v => (Math.round(v * 100) / 100);
// cached style writer: x/y px, xp/yp %, r deg, s/sx/sy scale, o opacity, f filter, clip clip-path
function S(e, o) {
  let tf = "";
  if (o.x != null || o.y != null) tf += `translate(${f2(o.x || 0)}px,${f2(o.y || 0)}px)`;
  if (o.xp != null || o.yp != null) tf += ` translate(${f2(o.xp || 0)}%,${f2(o.yp || 0)}%)`;
  if (o.pz) tf = `perspective(${o.pz}px) ` + tf;
  if (o.ry) tf += ` rotateY(${f2(o.ry)}deg)`;
  if (o.rx) tf += ` rotateX(${f2(o.rx)}deg)`;
  if (o.r) tf += ` rotate(${f2(o.r * 10) / 10}deg)`;
  if (o.s != null) tf += ` scale(${Math.round(o.s * 1e4) / 1e4})`;
  if (o.sx != null || o.sy != null) tf += ` scale(${Math.round((o.sx ?? 1) * 1e4) / 1e4},${Math.round((o.sy ?? 1) * 1e4) / 1e4})`;
  const st = e.style, c = e._c || (e._c = {});
  if (tf !== c.tf) { st.transform = tf || "none"; c.tf = tf; }
  if (o.o != null) {
    const v = Math.round(clamp(o.o) * 1000) / 1000;
    if (v !== c.o) { st.opacity = v; st.visibility = v <= 0 ? "hidden" : "visible"; c.o = v; }
  }
  if (o.f != null && o.f !== c.f) { st.filter = o.f; c.f = o.f; }
  if (o.clip != null && o.clip !== c.clip) { st.clipPath = o.clip; c.clip = o.clip; }
  if (o.bg != null && o.bg !== c.bg) { st.background = o.bg; c.bg = o.bg; }
}
const show = (e, v) => { const c = e._c || (e._c = {}); if (c.show !== v) { e.style.display = v ? "" : "none"; c.show = v; } };

const bursts = [];
function burst(parent, x, y, t0, o = {}) {
  const n = o.n || 10, els = [];
  for (let k = 0; k < n; k++) { const e = el("div", "abs spk", parent); e.style.background = o.color || "#fff"; els.push(e); }

}
function updBursts(t) {
  for (const b of bursts) {
    const p = (t - b.t0) / b.dur;
    for (let k = 0; k < b.n; k++) {
      const e = b.els[k];
      if (p <= 0 || p >= 1) { S(e, {o: 0}); continue; }
      const a = 2 * Math.PI * k / b.n + (rnd(b.seed + k) - .5) * .5;
      const d = b.dist * (.65 + .35 * rnd(b.seed + k * 7)) * E.out3(p);
      S(e, {x: b.x + Math.cos(a) * d, y: b.y + Math.sin(a) * d, s: b.size * (1 - p) * (.7 + .6 * rnd(b.seed + k * 3)), o: 1 - p * p});

  const press = bump(t - 14.40, 22);
  S(cta, {s: cp * (1 - .06 * press), o: clamp((t - 13.78) / .06)});
  S(ctaAr, {x: 8 * bump(t - 14.44, 9) + 5 * Math.max(0, Math.sin((t - 14.6) * 9)) * (t > 14.6 ? 1 : 0)});
  const cr = rectCTA();
  const tx = cr.x + cr.w - 58, ty = cr.y + cr.h * .58;
  const rp = P(t, 14.40, .55);
  S(ctaRip, {x: tx, y: ty, s: .2 + 3.2 * E.out3(rp), o: rp > 0 && rp < 1 ? .5 * (1 - rp) : 0});
  $$(".w", url).forEach(w => { const pin = tw(t, 13.95, .7, E.outX); S(w, {yp: (1 - pin) * 110}); });
  S(url, {o: t > 13.9 ? 1 : 0});
  // cursor glides in and clicks
  const cu = tw(t, 13.98, .44, E.io3), aw = tw(t, 14.62, .5, E.io3);
  S(cursor, {x: bez(1180, 1060, tx, cu) + aw * 46, y: bez(1120, 900, ty, cu) + aw * 58, s: 1 - .14 * press, o: clamp((t - 13.98) / .1)});
}
let _cr = null;
function rectCTA() { return _cr || (_cr = {x: 140, y: 676, w: cta.offsetWidth, h: 88}); }

function upFx(t) {
  const fl = .55 * Math.exp(-(t - T.b3) * 14) * (t >= T.b3 ? 1 : 0) + .35 * Math.exp(-(t - T.b8) * 12) * (t >= T.b8 ? 1 : 0);
  S(flash, {o: fl});
  // camera shake on the two impacts + knocks
  const sh = wob(t - T.b3, 11, 9) * 9 + wob(t - T.b8, 10, 10) * 5;
  const sv = wob(t - T.b3 - .03, 13, 9) * 6 + wob(t - T.b8 - .02, 12, 10) * 4;
  stage._shake = {x: sh, y: sv};
  updBursts(t);
}

/* ================= master render ================= */
let fitScale = 1;
function renderAt(t) {
  t = clamp(t, 0, DUR);
  upBg(t); up2(t); up1(t); up3(t); up5(t); up6(t); up7(t); upDot(t); upFx(t);
  const sh = stage._shake || {x: 0, y: 0};
  stage.style.transform = `scale(${fitScale}) translate(${f2(sh.x)}px,${f2(sh.y)}px)`;
}

/* ================= boot ================= */
async function boot() {
  G = window.GEOMETRY;
  buildLogo(); buildWill();
  await document.fonts.ready;
  await Promise.all([...document.images].map(im => im.decode().catch(() => {})));
  measure();
  // sparkle bursts (pan coordinates for 3/4, stage coordinates otherwise)
  burst(fx, M.per.x, M.per.y, .62, {n: 8, dist: 60, color: "#0046DA", seed: 3, size: .8});
  burst(pan, N1.x - 200, N1.y - 40, T.b3 + 2 * BEAT, {n: 10, dist: 110, color: "#fff", seed: 11});
  burst(pan, N1.x - 200, N1.y - 40, T.b3 + 2 * BEAT + .02, {n: 8, dist: 80, color: "#0046DA", seed: 17, size: .7});
  burst(pan, N2.x - 200, N2.y - 40, T.b3 + 3 * BEAT, {n: 10, dist: 110, color: "#fff", seed: 23});
  burst(pan, X4 + 1322 + 90, 568 + 126, 6.48, {n: 10, dist: 120, color: "#22A045", seed: 31, size: .8});
  burst(s5, DAYX[4], DAYY + 78, WEEK0 + 4 * BEAT / 4, {n: 10, dist: 90, color: "#0046DA", seed: 41, size: .8});
  burst(s7, 140 + cta.offsetWidth - 58, 676 + 51, 14.42, {n: 12, dist: 150, color: "#fff", seed: 51});
  buildCues();
  window.CUES = CUES.sort((a, b) => a.t - b.t);
  window.renderAt = renderAt;
  window.META = {DUR, BPM, BEAT, BAR, bars: T};
  renderAt(0);
  window.__ready = true;
  if (!RENDER) preview();
}

/* ================= preview player ================= */
function preview() {
  const snd = $("#snd"), pp = $("#pp"), seek = $("#seek"), tc = $("#tc"), big = $("#big");
  const fit = () => { fitScale = Math.min(innerWidth / 1920, innerHeight / 1080); renderAt(cur()); };
  let playing = false, t0 = 0, tStart = 0, hasAudio = true;
  snd.addEventListener("error", () => hasAudio = false);
  const cur = () => playing ? (hasAudio && !snd.paused ? snd.currentTime : (performance.now() - t0) / 1000 + tStart) : tStart;
  function play() {
    if (tStart >= DUR - .01) tStart = 0;
    playing = true; big.style.display = "none"; pp.textContent = "Pause";
    t0 = performance.now();
    if (hasAudio) { snd.currentTime = tStart; snd.play().catch(() => hasAudio = false); }
  }
  function pause() { tStart = cur(); playing = false; snd.pause(); pp.textContent = "Play"; }
  pp.onclick = () => playing ? pause() : play();
  big.onclick = play;
  seek.oninput = () => { const v = seek.value / 1000; if (playing) pause(); tStart = v; renderAt(v); };
  addEventListener("keydown", e => {
    if (e.code === "Space") { e.preventDefault(); playing ? pause() : play(); }
    if (e.code === "ArrowRight" || e.code === "ArrowLeft") { if (playing) pause(); tStart = clamp(tStart + (e.code === "ArrowRight" ? 1 / 60 : -1 / 60), 0, DUR); renderAt(tStart); }
  });
  addEventListener("resize", fit); fit();
  (function loop() {
    const t = cur();
    if (playing && t >= DUR) { pause(); tStart = DUR; }
    renderAt(Math.min(t, DUR));
    seek.value = Math.round(Math.min(t, DUR) * 1000);
    tc.textContent = `${Math.min(t, DUR).toFixed(2)} / ${DUR.toFixed(2)}`;
    requestAnimationFrame(loop);
  })();
}
boot();
})();
</script>
